# Temporary native evidence for this PR; removed before merge.
name: login-browser-evidence
on:
  pull_request:
jobs:
  native-login:
    if: github.head_ref == 'agent/otter/login-open-browser'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
        version: ["2.1.126", "2.1.304"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --prefix .native-login --ignore-scripts --no-audit --no-fund @anthropic-ai/claude-code@${{ matrix.version }}
      - name: Isolated unlocked keychain on the disposable macOS runner
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          security create-keychain -p '' "$RUNNER_TEMP/oar-login.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/oar-login.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/oar-login.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/oar-login.keychain-db"
          security unlock-keychain -p '' "$RUNNER_TEMP/oar-login.keychain-db"
          security add-generic-password -a oar-probe -s oar-login-browser-probe -w synthetic-placeholder -T /usr/bin/security "$RUNNER_TEMP/oar-login.keychain-db"
          security find-generic-password -a oar-probe -s oar-login-browser-probe -w "$RUNNER_TEMP/oar-login.keychain-db" >/dev/null
          security delete-generic-password -a oar-probe -s oar-login-browser-probe "$RUNNER_TEMP/oar-login.keychain-db"
      - name: Native browser behavior with explicit keychain environment skip
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsx experiments/claude-login-browser/probe.ts --package .native-login ${{ matrix.version }} --macos-keychain-unavailable | tee native-login.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-login-${{ matrix.os }}-${{ matrix.version }}
          path: native-login.jsonl
          if-no-files-found: warn
      - name: Remove synthetic macOS credentials
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/oar-login.keychain-db"
