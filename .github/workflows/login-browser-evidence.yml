# Temporary native evidence for this PR; removed before merge.
name: login-browser-evidence
on:
  pull_request:
jobs:
  native-login:
    if: github.head_ref == 'agent/otter/login-open-browser'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        version: ["2.1.126", "2.1.304"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --prefix .native-login --ignore-scripts --no-audit --no-fund @anthropic-ai/claude-code@${{ matrix.version }}
      - name: Isolated unlocked keychain on the disposable macOS runner
        if: runner.os == 'macOS'
        run: |
          security create-keychain -p oar-synthetic-only "$RUNNER_TEMP/oar-login.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/oar-login.keychain-db"
          security unlock-keychain -p oar-synthetic-only "$RUNNER_TEMP/oar-login.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/oar-login.keychain-db"
          security default-keychain -d user -s "$RUNNER_TEMP/oar-login.keychain-db"
      - name: Windows URL argument and open stdin observations
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node --input-type=module <<'JS' | tee windows-noop.jsonl
          import { spawn } from 'node:child_process';
          import path from 'node:path';
          for (const name of ['hostname.exe', 'ipconfig.exe', 'netstat.exe', 'route.exe', 'arp.exe']) {
            for (const quoted of [false, true]) {
              const url = 'https://example.invalid/login?state=probe&next=ignored';
              const p = spawn(path.join(process.env.SystemRoot, 'System32', name), [quoted ? '"' + url + '"' : url], { stdio: 'pipe', windowsHide: true });
              let stdout = '', stderr = '', timedOut = false;
              p.stdout.on('data', b => { stdout += b; });
              p.stderr.on('data', b => { stderr += b; });
              const timer = setTimeout(() => { timedOut = true; p.kill(); }, 3000);
              const exit = await new Promise((resolve, reject) => { p.once('close', resolve); p.once('error', reject); });
              clearTimeout(timer);
              console.log(JSON.stringify({ name, quoted, exit, timedOut, stdoutBytes: stdout.length, stderrBytes: stderr.length, usage: /usage|syntax|unrecognized|argument/i.test(stdout + stderr) }));
            }
          }
          JS
      - name: Native login with synthetic OAuth
        shell: bash
        run: |
          set -o pipefail
          pnpm exec tsx experiments/claude-login-browser/probe.ts --package .native-login ${{ matrix.version }} | tee native-login.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-login-${{ matrix.os }}-${{ matrix.version }}
          path: |
            native-login.jsonl
            windows-noop.jsonl
          if-no-files-found: warn
      - name: Remove synthetic macOS credentials
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/oar-login.keychain-db"
