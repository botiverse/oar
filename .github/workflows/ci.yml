name: qoder-windows-diagnostic
on:
  pull_request:
  workflow_dispatch:
jobs:
  startup:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      OAR_TEST: qoder-native
      OAR_TEST_CONCURRENCY: "2"
      OAR_CHILD_STDERR: inherit
      OAR_TRIAL_RUN_DIR: ${{ github.workspace }}/oar-trial-run
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g @qoder-ai/qodercli@1.1.78
      - name: One cold native initialization, unchanged control deadline
        run: pnpm exec tsx experiments/qoder-windows-startup.ts
      - name: Sequential native scenarios with isolated homes
        if: always()
        run: pnpm exec vitest run sea-trial/vendor/qoder.vendor.test.ts
      - name: Original concurrent behavior suite after the single-session probes
        if: always()
        run: pnpm run sea-trial
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qoder-windows-startup-diagnostic
          path: ${{ github.workspace }}/oar-trial-run
          if-no-files-found: warn
