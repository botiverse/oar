name: Windows root identity observation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
      - name: Observe root identities and exit boundaries
        run: node experiments/windows-root-identity/observe.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-root-identity
          path: oar-trial-run/windows-root-identity
          if-no-files-found: error
