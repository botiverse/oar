name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build

  # OpenDAL-style behavior jobs: the shared behavior suite instantiated per
  # backend. aimock backends run the REAL claude/codex binaries against a
  # scripted local provider — no login, no tokens — so they can run on every
  # OS in CI. OAR_TEST selects the backend; an unavailable one skips.
  behavior:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        backend: [claude-aimock, codex-aimock, pi-aimock]
    runs-on: ${{ matrix.os }}
    env:
      OAR_TEST: ${{ matrix.backend }}
      OAR_TRIAL_RUN_DIR: ${{ runner.temp }}/oar-trial-run
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # npm's download cache for the CLI installs below (content-addressed,
      # so a stale restore never pins an old CLI version — latest still
      # resolves, only unchanged tarballs are reused). pi needs no install:
      # it is the bundled SDK already in node_modules.
      - uses: actions/cache@v4
        if: matrix.backend != 'pi-aimock'
        with:
          path: |
            ~/.npm
            ~/AppData/Local/npm-cache
          key: npm-dl-${{ runner.os }}-${{ matrix.backend }}-${{ github.run_id }}
          restore-keys: npm-dl-${{ runner.os }}-${{ matrix.backend }}-
      - run: npm install -g @anthropic-ai/claude-code
        if: matrix.backend == 'claude-aimock'
      - run: npm install -g @openai/codex
        if: matrix.backend == 'codex-aimock'
      - run: pnpm run sea-trial
      # Vendor error-edge snapshots for this backend (vitest, OAR_TEST-gated).
      - run: pnpm vitest run sea-trial/vendor
      # The run directory is a test artifact: traces + logs, uploaded even
      # (especially) when the run failed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sea-trial-${{ matrix.backend }}-${{ matrix.os }}
          path: ${{ runner.temp }}/oar-trial-run
          if-no-files-found: ignore
