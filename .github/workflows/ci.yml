name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "assets/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "assets/**"]
  # A release commit whose push run flaked gets a fresh run with
  # `stamp workflow run ci.yml --repo botiverse/oar` (agents cannot rerun push runs).
  workflow_dispatch:

jobs:
  # Which behavior backends and platforms this run needs (.github/scripts/ci-select.mjs):
  # a pull request runs only the backends its files can reach, on Linux; pushes to
  # main and dispatches run every backend on every platform before a release.
  changes:
    runs-on: ubuntu-latest
    outputs:
      behavior: ${{ steps.pick.outputs.behavior }}
      acp: ${{ steps.pick.outputs.acp }}
      os: ${{ steps.pick.outputs.os }}
      acp_os: ${{ steps.pick.outputs.acp_os }}
      pi_rpc: ${{ steps.pick.outputs.pi_rpc }}
      pi_rpc_windows: ${{ steps.pick.outputs.pi_rpc_windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        run: node .github/scripts/ci-select.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-cancellation-timing
          path: ${{ github.workspace }}/oar-trial-run/cancellation-timing
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-watchdog-diagnostics
          path: ${{ github.workspace }}/oar-trial-run/pi-rpc-diagnostics
          if-no-files-found: warn
      - run: pnpm run build
      - name: Cursor SDK skill loader parity (offline)
        run: pnpm vitest run sea-trial/vendor/cursor-skills.vendor.test.ts
        timeout-minutes: 3
        env:
          OAR_TEST: cursor-skills
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cursor-skills-${{ matrix.os }}
          path: ${{ github.workspace }}/oar-trial-run/cursor-skills
          if-no-files-found: warn
      - name: Install pinned OpenCode for native isolated cleanup
        run: node .github/scripts/runtime-install.mjs opencode-cleanup
      - name: Native isolated OpenCode tool cleanup
        run: pnpm vitest run sea-trial/vendor/opencode-cleanup.vendor.test.ts sea-trial/vendor/opencode-skills.vendor.test.ts
        timeout-minutes: 5
        env:
          OAR_TEST: opencode-cleanup
          OAR_TRIAL_RUN_DIR: ${{ github.workspace }}/oar-trial-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-cleanup-${{ matrix.os }}
          path: ${{ github.workspace }}/oar-trial-run/opencode-cleanup
          if-no-files-found: warn
      # Real Kimi login and workspace skill discovery, no account or browser.
      - run: node .github/scripts/runtime-install.mjs kimi-login
        id: kimi-login-install
        if: always() && !cancelled()
      - run: pnpm vitest run sea-trial/vendor/kimi-login.vendor.test.ts sea-trial/vendor/kimi-skills.vendor.test.ts sea-trial/vendor/kimi-expired-usage.vendor.test.ts
        if: always() && !cancelled() && steps.kimi-login-install.outcome == 'success'
        env:
          OAR_TEST: kimi-login
          OAR_TRIAL_RUN_DIR: ${{ github.workspace }}/oar-trial-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kimi-login-${{ matrix.os }}
          path: |
            ${{ github.workspace }}/oar-trial-run/kimi-login
            ${{ github.workspace }}/oar-trial-run/kimi-expired-usage
          if-no-files-found: warn

      - name: Install current Kimi for fresh workspace cleanup
        id: kimi-skills-install
        if: always() && !cancelled()
        run: node .github/scripts/runtime-install.mjs kimi-skills
      - name: Native Kimi skills with fresh workspace IDs
        if: always() && !cancelled() && steps.kimi-skills-install.outcome == 'success'
        run: pnpm vitest run sea-trial/vendor/kimi-skills.vendor.test.ts
        env:
          OAR_TEST: kimi-skills

      - name: Install pinned agy CLI for native ACP regressions
        id: agy-install
        if: ${{ !cancelled() }}
        shell: pwsh
        run: node .github/scripts/install-antigravity.mjs
      - name: Native agy ACP behavior
        if: ${{ !cancelled() && steps.agy-install.outcome == 'success' }}
        run: pnpm run sea-trial
        timeout-minutes: 12
        env:
          OAR_TEST: antigravity-aimock
          OAR_TEST_REQUIRE_AVAILABLE: '1'
          OAR_TEST_CONCURRENCY: '2'
          OAR_TRIAL_RUN_DIR: ${{ github.workspace }}/oar-trial-run/agy
      - name: Native agy ACP vendor regressions
        if: ${{ !cancelled() && steps.agy-install.outcome == 'success' }}
        run: pnpm vitest run sea-trial/vendor --maxWorkers 2
        timeout-minutes: 12
        env:
          OAR_TEST: antigravity-aimock
          OAR_TEST_REQUIRE_AVAILABLE: '1'
          OAR_TRIAL_RUN_DIR: ${{ github.workspace }}/oar-trial-run/agy
      - name: Install agy 1.5.11 for skill reader verification
        id: agy-file-skills-install
        if: ${{ !cancelled() }}
        run: node .github/scripts/runtime-install.mjs antigravity-file-skills .github/antigravity-file-skills.json
      - name: Native agy skill reader verification
        if: ${{ !cancelled() && steps.agy-file-skills-install.outcome == 'success' }}
        run: pnpm vitest run sea-trial/vendor/antigravity-file-skills.vendor.test.ts sea-trial/vendor/antigravity-windows-skills.vendor.test.ts
        env:
          OAR_TEST: antigravity-file-skills
          OAR_TRIAL_RUN_DIR: ${{ github.workspace }}/oar-trial-run/agy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agy-acp-${{ matrix.os }}
          path: ${{ github.workspace }}/oar-trial-run/agy
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-install-check-${{ matrix.os }}
          path: ${{ github.workspace }}/oar-trial-run/runtime-install
          if-no-files-found: warn

  # The packed packages installed into an empty project the way a host
  # installs them: OAR without its optional peer @cursor/sdk must load,
  # type-check and probe every other runtime (tests/clean-install.ts).
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run clean-install -- --mode=gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accepted-host
          path: oar-trial-run/clean-install
          if-no-files-found: error

  # Real browser and SDK, with provider HTTP routed to a local scripted server.
  browser-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner image already has Chromium's libraries; --with-deps only adds fonts
      # from Ubuntu's mirrors, which the runner sometimes cannot resolve (2026-11-11).
      # The smoke test decides whether the browser runs without them.
      - run: pnpm exec playwright install chromium
      - run: pnpm exec playwright install-deps chromium
        continue-on-error: true
      - run: pnpm run durable-demo:smoke

  # OpenDAL-style behavior jobs: the shared behavior suite instantiated per
  # backend. aimock backends run the REAL claude/codex binaries against a
  # scripted local provider (no login, no tokens), so they can run on every
  # OS in CI. OAR_TEST selects the backend; an unavailable one skips.
  behavior:
    needs: changes
    if: needs.changes.outputs.behavior != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.os) }}
        backend: ${{ fromJSON(needs.changes.outputs.behavior) }}
        exclude:
          - os: windows-latest
            backend: pi-rpc-aimock
          # droid's Windows build is not yet verified by OAR (docs/runtimes/factory.md).
          - os: windows-latest
            backend: factory-aimock
    runs-on: ${{ matrix.os }}
    env:
      OAR_TEST: ${{ matrix.backend }}
      # Bound native Qoder cold starts on all platforms without changing per-call deadlines.
      OAR_TEST_CONCURRENCY: ${{ (matrix.backend == 'qoder-native' || matrix.backend == 'dsh-aimock') && '2' || '' }}
      OAR_TEST_REQUIRE_AVAILABLE: ${{ (matrix.backend == 'dsh-aimock' || matrix.backend == 'factory-aimock') && '1' || '' }}
      OAR_CHILD_STDERR: ${{ ((matrix.os == 'windows-latest' && matrix.backend == 'codex-aimock') || matrix.backend == 'qoder-native' || matrix.backend == 'dsh-aimock') && 'inherit' || '' }}
      # runner context is not allowed in job-level env; workspace-relative works everywhere
      OAR_TRIAL_RUN_DIR: ${{ github.workspace }}/oar-trial-run
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # npm's download cache for the CLI installs below (content-addressed,
      # so restored downloads do not select a version: the explicit specs
      # below do, and unchanged tarballs are reused). pi needs no install:
      # it is the bundled SDK already in node_modules.
      - name: Locate npm's download cache
        id: npm-cache
        if: matrix.backend == 'claude-aimock' || matrix.backend == 'codex-aimock' || matrix.backend == 'qwen-aimock' || matrix.backend == 'qoder-native' || matrix.backend == 'dsh-aimock' || matrix.backend == 'factory-aimock'
        shell: pwsh
        run: |
          $npmCachePath = (npm config get cache).Trim()
          if ($LASTEXITCODE -ne 0 -or !$npmCachePath) {
            throw 'Could not locate the npm download cache.'
          }
          "path=$npmCachePath" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@v4
        if: matrix.backend == 'claude-aimock' || matrix.backend == 'codex-aimock' || matrix.backend == 'qwen-aimock' || matrix.backend == 'qoder-native' || matrix.backend == 'dsh-aimock' || matrix.backend == 'factory-aimock'
        with:
          path: ${{ steps.npm-cache.outputs.path }}
          key: npm-dl-${{ runner.os }}-${{ matrix.backend }}-${{ github.run_id }}
          restore-keys: npm-dl-${{ runner.os }}-${{ matrix.backend }}-
      # Minimum and replay purposes remain separate entries in the version table.
      - name: Install and verify accepted native runtime
        if: matrix.backend == 'claude-aimock' || matrix.backend == 'codex-aimock' || matrix.backend == 'qwen-aimock' || matrix.backend == 'qoder-native' || matrix.backend == 'dsh-aimock' || matrix.backend == 'factory-aimock'
        run: node .github/scripts/runtime-install.mjs '${{ matrix.backend }}'
      - run: pnpm run sea-trial
      # Vendor error-edge snapshots for this backend (vitest, OAR_TEST-gated).
      - run: pnpm vitest run sea-trial/vendor
      # The run directory is a test artifact: traces + logs, uploaded even
      # (especially) when the run failed.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sea-trial-${{ matrix.backend }}-${{ matrix.os }}
          path: ${{ github.workspace }}/oar-trial-run
          if-no-files-found: warn

  # Guard the explicit-command floor independently of OAR's bundled Pi version.
  # Raise this pin and PI_RPC_MINIMUM_VERSION together in the same change.
  pi-rpc-minimum:
    needs: changes
    if: needs.changes.outputs.pi_rpc == 'true'
    runs-on: ubuntu-latest
    env:
      OAR_TEST: pi-rpc-aimock
      OAR_TEST_REQUIRE_AVAILABLE: '1'
      OAR_TRIAL_RUN_DIR: ${{ github.workspace }}/oar-trial-run
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install and verify the minimum supported explicit Pi CLI
        run: node .github/scripts/runtime-install.mjs pi-rpc-minimum
      - run: pnpm run sea-trial
      - run: pnpm vitest run sea-trial/vendor
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sea-trial-pi-rpc-minimum-ubuntu-latest
          path: ${{ github.workspace }}/oar-trial-run
          if-no-files-found: warn

  # Separate VMs retain each phase's outcome if the other loses its runner.
  # Vendor groups expose progress through jobs API step names and timestamps.
  # CI ceilings may preserve a hung step's logs while its runner is alive.
  pi-rpc-windows:
    needs: changes
    if: needs.changes.outputs.pi_rpc_windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        phase: [behavior, vendor]
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      OAR_TEST: pi-rpc-aimock
      OAR_TRIAL_RUN_DIR: ${{ github.workspace }}/oar-trial-run
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pi RPC behavior with Windows resource samples
        if: matrix.phase == 'behavior'
        shell: pwsh
        run: ./sea-trial/windows-resources.ps1 -Stage behavior -Command 'pnpm run sea-trial'
      - name: Pi RPC vendor - RPC protocol, files, readers and bundled host
        if: ${{ !cancelled() && matrix.phase == 'vendor' }}
        timeout-minutes: 6
        shell: pwsh
        run: ./sea-trial/windows-pi-vendor.ps1 -Group rpc
      - name: Pi RPC vendor - native Pi extensions, projects and errors
        if: ${{ !cancelled() && matrix.phase == 'vendor' }}
        timeout-minutes: 6
        shell: pwsh
        run: ./sea-trial/windows-pi-vendor.ps1 -Group pi
      - name: Pi RPC vendor - MCP tools and servers
        if: ${{ !cancelled() && matrix.phase == 'vendor' }}
        timeout-minutes: 6
        shell: pwsh
        run: ./sea-trial/windows-pi-vendor.ps1 -Group mcp
      - name: Pi RPC vendor - shared runtime contracts
        if: ${{ !cancelled() && matrix.phase == 'vendor' }}
        timeout-minutes: 6
        shell: pwsh
        run: ./sea-trial/windows-pi-vendor.ps1 -Group shared
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sea-trial-pi-rpc-aimock-windows-latest-${{ matrix.phase }}
          path: ${{ github.workspace }}/oar-trial-run
          if-no-files-found: warn

  # Native ACP agents with a local scripted provider; no account credentials.
  # Pin these versions with the daily compatibility evidence, including the v1
  # OpenCode package. Its v2 protocol needs separate vendor fixtures.
  acp-behavior:
    needs: changes
    if: needs.changes.outputs.acp != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.acp_os) }}
        backend: ${{ fromJSON(needs.changes.outputs.acp) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OAR_TEST: ${{ matrix.backend }}
      OAR_TEST_REQUIRE_AVAILABLE: '1'
      OAR_TEST_CONCURRENCY: '2'
      OAR_TRIAL_RUN_DIR: ${{ github.workspace }}/oar-trial-run
      OAR_TEST_MCP_PROGRESS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # These packages carry native dependencies in npm tarballs. Cache
      # downloads, not a mutable global installation or runtime HOME.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/AppData/Local/npm-cache
          key: npm-acp-${{ runner.os }}-${{ runner.arch }}-${{ matrix.backend }}-${{ hashFiles('.github/runtime-versions.json') }}
      - name: Install and verify accepted native runtime
        run: node .github/scripts/runtime-install.mjs '${{ matrix.backend }}'
      - run: pnpm run sea-trial
        timeout-minutes: 12
      - run: pnpm vitest run sea-trial/vendor --maxWorkers 2
        timeout-minutes: 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sea-trial-${{ matrix.backend }}-${{ matrix.os }}
          path: ${{ github.workspace }}/oar-trial-run
          if-no-files-found: warn
