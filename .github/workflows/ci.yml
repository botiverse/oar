name: Windows dispose timing
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timing:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        prepared: ['false', 'true']
    defaults:
      run:
        shell: bash
    env:
      OAR_WINDOWS_TIMING_PREPARED: ${{ matrix.prepared }}
      OAR_TRIAL_RUN_DIR: ${{ github.workspace }}/oar-trial-run/windows-dispose-timing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g @anthropic-ai/claude-code@2.1.316
      - name: Observe existing behavior and shutdown phases
        run: pnpm vitest run --config experiments/windows-dispose-timing/vitest.config.ts
        timeout-minutes: 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-dispose-prepared-${{ matrix.prepared }}
          path: oar-trial-run/windows-dispose-timing
