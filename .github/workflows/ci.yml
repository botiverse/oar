name: Windows OpenCode isolated cleanup baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-baseline:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g @opencode/cli@2.2.3
        timeout-minutes: 3
      - name: Main product code with the isolated lifecycle regression
        run: pnpm vitest run sea-trial/vendor/opencode-cleanup.vendor.test.ts --maxWorkers 1
        timeout-minutes: 5
        env:
          OAR_TEST: opencode-cleanup
          OAR_TRIAL_RUN_DIR: ${{ github.workspace }}/oar-trial-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-cleanup-baseline-windows
          path: ${{ github.workspace }}/oar-trial-run
          if-no-files-found: error
