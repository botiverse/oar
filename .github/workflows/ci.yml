name: Windows output handle investigation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investigate:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Descendant inherits step output handles
        shell: pwsh
        run: ./experiments/windows-handles/step.ps1 -Mode inherited -OutputDirectory "$env:GITHUB_WORKSPACE/oar-trial-run/windows-handles/inherited"
      - name: Observe following step and clean up inherited child
        if: always()
        run: node experiments/windows-handles/fixture.ts observe "$env:GITHUB_WORKSPACE/oar-trial-run/windows-handles/inherited"
      - name: Descendant writes to files
        shell: pwsh
        run: ./experiments/windows-handles/step.ps1 -Mode file -OutputDirectory "$env:GITHUB_WORKSPACE/oar-trial-run/windows-handles/file"
      - name: Observe following step and clean up file child
        if: always()
        run: node experiments/windows-handles/fixture.ts observe "$env:GITHUB_WORKSPACE/oar-trial-run/windows-handles/file"
      - name: Bounded termination prototype and injected unreturned Kill
        run: node experiments/windows-handles/check-termination.ts "$env:GITHUB_WORKSPACE/oar-trial-run/windows-handles/termination"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-output-handles
          path: oar-trial-run/windows-handles
          if-no-files-found: error
