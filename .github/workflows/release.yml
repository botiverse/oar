name: release

# Publish both packages to npm. Two triggers:
# - workflow_dispatch with a version (`stamp workflow run release.yml
#   --repo botiverse/oar -f version=X.Y.Z`): releases the head of main once
#   its CI run succeeded, then the `release` job creates the `vX.Y.Z` tag and
#   the GitHub release, whose notes are the body of the pull request that
#   produced the commit. A tag pushed with GITHUB_TOKEN starts no workflow,
#   so this path publishes once.
# - a pushed `v*` tag, as before: publishes that commit, nothing else.
# Auth is npm trusted publishing (OIDC): the publish job only requests an
# id-token; no npm token secret exists in this repo. The npm-side
# trusted-publisher configuration names this file and is owner-managed; it
# does not restrict the trigger, so the publish step must stay in this file.
# The job that runs project code holds no write token; only the release job,
# which runs none, may push the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (both package.json files on main must already say it)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # reads ci.yml's run for the released commit
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # A dispatched release is only ever the current head of main, once
      # ci.yml succeeded on that exact commit, and never an existing tag.
      - name: gate a dispatched release on main's CI
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "not a version: $TAG"; exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "dispatch from main only (got $GITHUB_REF)"; exit 1
          fi
          # Fail closed: an API error aborts here instead of reading as "no tag".
          existing=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .ref")
          if [ -n "$existing" ]; then
            echo "$TAG already exists"; exit 1
          fi
          for attempt in $(seq 1 60); do
            # The newest push or hand-started run on this exact commit: a run
            # started with `stamp workflow run ci.yml` replaces a flaked one.
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA" \
              --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | {status, conclusion}] | first // empty')
            if [ -z "$run" ]; then
              # ci.yml skips docs-only pushes: a head without a run after ten
              # minutes is not a release commit.
              if [ "$attempt" -ge 10 ]; then
                echo "no ci.yml run for $GITHUB_SHA; dispatch right after the release pull request merges"; exit 1
              fi
              echo "no CI run for $GITHUB_SHA yet"
            else
              status=$(echo "$run" | jq -r .status)
              conclusion=$(echo "$run" | jq -r .conclusion)
              echo "CI for $GITHUB_SHA: $status $conclusion"
              if [ "$status" = "completed" ]; then
                [ "$conclusion" = "success" ] && exit 0
                echo "CI did not succeed on $GITHUB_SHA"; exit 1
              fi
            fi
            sleep 60
          done
          echo "CI on $GITHUB_SHA did not finish within an hour"; exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      # The tag is the single source of truth: refuse to publish when any
      # workspace package disagrees with it.
      - name: verify tag matches package versions
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const tag = process.env.TAG;
            const bad = ["packages/oar/package.json", "packages/cli/package.json"]
              .map((p) => JSON.parse(readFileSync(p, "utf8")))
              .filter((pkg) => `v${pkg.version}` !== tag);
            if (bad.length > 0) {
              console.error(`tag ${tag} does not match: ${bad.map((p) => `${p.name}@${p.version}`).join(", ")}`);
              process.exit(1);
            }
          '
      - run: pnpm run check
      - run: pnpm run build
      # pnpm publish (not npm) so workspace:* deps are rewritten to the real
      # version in the published manifests.
      - run: pnpm -r publish --access public --no-git-checks

  # Runs no project code. Idempotent, so "Re-run failed jobs" finishes a
  # release whose publish succeeded.
  release:
    needs: publish
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the tag and creates the GitHub release
      pull-requests: read # reads the release notes from the commit's pull request
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: tag and create the GitHub release
        shell: bash
        run: |
          set -euo pipefail
          # The commit an existing tag points at (peeled for an annotated tag).
          refs=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          existing=$(printf '%s\n' "$refs" | awk -v ref="refs/tags/$TAG^{}" '$2 == ref {print $1}')
          [ -n "$existing" ] || existing=$(printf '%s\n' "$refs" | awk -v ref="refs/tags/$TAG" '$2 == ref {print $1}')
          if [ -z "$existing" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          elif [ "$existing" != "$GITHUB_SHA" ]; then
            echo "$TAG points at $existing, not $GITHUB_SHA"; exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"; exit 0
          fi
          # The release pull request's body, without Stamp's review block
          # and the generated-by footer.
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].body // ""' \
            | sed -e '/<!-- stamp:review:v1 -->/,/<!-- \/stamp:review:v1 -->/d' -e '/Generated with \[Claude Code\]/d' > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
