name: Shared runtime evidence

on:
  workflow_dispatch:
    inputs:
      runtimes:
        description: 'JSON array of runtimes to observe'
        required: true
        default: '["codex","kimi","grok","opencode","antigravity","qoder"]'
      platforms:
        description: 'JSON array of runner platforms'
        required: true
        default: '["ubuntu-latest","windows-latest","macos-latest"]'
      resources_only:
        description: 'Collect resources only; retain earlier observation results separately'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  observe:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platforms) }}
        runtime: ${{ fromJSON(inputs.runtimes) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      EVIDENCE_RUNTIME: ${{ matrix.runtime }}
      EVIDENCE_PACKAGE: ${{ fromJSON('{"codex":"@openai/codex@0.166.0","kimi":"@moonshot-ai/kimi-code@2.4.1","grok":"@xai-official/grok@1.0.70","opencode":"@opencode/cli@2.2.3","qoder":"@qoder-ai/qodercli@1.1.81"}')[matrix.runtime] }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: native-install
        if: matrix.runtime != 'antigravity'
        run: npm install -g "$EVIDENCE_PACKAGE"
      - name: Install pinned Antigravity ACP archive
        id: antigravity-install
        if: matrix.runtime == 'antigravity'
        shell: pwsh
        run: |
          # Versioned archives and digests from the public ACP registry.
          $archives = @{
            'Linux-X64' = @('linux/agy-acp-server-1.4.5-linux-x86_64.zip', '923923a0d7dc8073f66cc6f78647a3107e3a7ee2b7e1a24df8b3927b5188013b')
            'macOS-ARM64' = @('macos/agy-acp-server-1.4.5-darwin-arm64.zip', '886fff7767d08994ca39eb02c3d01a7532c7325a94aa33aaf52d52068733284f')
            'macOS-X64' = @('macos/agy-acp-server-1.4.5-darwin-x86_64.zip', 'b39f3573c03b9acb9df028853f647527f1f3133f32bd77e78b796e48a205114a')
            'Windows-X64' = @('windows/agy-acp-server-1.4.5-windows-x86_64.zip', 'd24f4c73c9f96d4f44384e281c855a56c72d8eaa9c5b0fad7ccb1635c6b63f50')
          }
          $entry = $archives["$env:RUNNER_OS-$env:RUNNER_ARCH"]
          if (-not $entry) { throw 'No verified archive for runner platform' }
          $archive = Join-Path $env:RUNNER_TEMP 'antigravity.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'antigravity'
          Invoke-WebRequest "https://dl.google.com/agy-extensions/releases/$($entry[0])" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $entry[1]) { throw 'Archive digest mismatch' }
          Expand-Archive $archive $destination
          $name = if ($IsWindows) { 'agy_acp_server.exe' } else { 'agy_acp_server.par' }
          $binaries = @(Get-ChildItem $destination -Recurse -File -Filter $name)
          if ($binaries.Count -ne 1) { throw 'Expected one ACP executable' }
          if (-not $IsWindows) {
            Get-ChildItem $destination -Recurse -File | ForEach-Object { chmod u+x $_.FullName }
          }
          "OAR_ANTIGRAVITY_BIN=$($binaries[0].FullName)" >> $env:GITHUB_ENV
      - name: Codex native observations
        if: ${{ !inputs.resources_only && matrix.runtime == 'codex' }}
        run: pnpm tsx experiments/sharing/codex.ts
        timeout-minutes: 12
      - name: ACP native observations
        if: ${{ !inputs.resources_only && contains(fromJSON('["kimi","grok","opencode","antigravity"]'), matrix.runtime) }}
        run: pnpm tsx experiments/sharing/acp.ts "$EVIDENCE_RUNTIME"
        timeout-minutes: 12
      - name: Qoder native observations
        if: ${{ !inputs.resources_only && matrix.runtime == 'qoder' }}
        run: pnpm tsx experiments/sharing/qoder.ts
        timeout-minutes: 12
      - name: Codex resources
        if: ${{ !cancelled() && (steps.native-install.outcome == 'success' || steps.antigravity-install.outcome == 'success') && matrix.runtime == 'codex' }}
        run: pnpm tsx experiments/sharing/codex-resources.ts
        timeout-minutes: 12
      - name: ACP resources
        if: ${{ !cancelled() && (steps.native-install.outcome == 'success' || steps.antigravity-install.outcome == 'success') && contains(fromJSON('["kimi","grok","opencode","antigravity"]'), matrix.runtime) }}
        run: pnpm tsx experiments/sharing/acp-resources.ts "$EVIDENCE_RUNTIME"
        timeout-minutes: 12
      - name: Qoder resources
        if: ${{ !cancelled() && (steps.native-install.outcome == 'success' || steps.antigravity-install.outcome == 'success') && matrix.runtime == 'qoder' }}
        run: pnpm tsx experiments/sharing/qoder-resources.ts
        timeout-minutes: 12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-evidence-${{ matrix.runtime }}-${{ runner.os }}-${{ runner.arch }}
          path: oar-trial-run
          if-no-files-found: warn
          retention-days: 14
