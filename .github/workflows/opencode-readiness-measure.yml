name: OpenCode synchronized startup on Windows
on:
  pull_request:
    paths:
      - 'experiments/opencode-simultaneous-start/**'
      - '.github/workflows/opencode-readiness-measure.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: node .github/scripts/runtime-install.mjs opencode-cleanup
      - name: Compare peer tree stop and fresh shared database initialization
        shell: pwsh
        run: |
          python -u experiments/opencode-simultaneous-start/compare.py --layouts peer-stop fresh | Tee-Object -FilePath "$env:RUNNER_TEMP/pairs.jsonl"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-windows-pairs
          path: ${{ runner.temp }}/pairs.jsonl
