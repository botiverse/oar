name: OpenCode Windows readiness measurement
on:
  pull_request:
    paths:
      - 'experiments/opencode-windows-readiness/**'
      - '.github/workflows/opencode-readiness-measure.yml'
permissions:
  contents: read
jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        layout: [shared, separate, full-suite]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: node .github/scripts/runtime-install.mjs opencode-cleanup
      - name: Compare concurrent agents using shared or separate native data
        shell: pwsh
        env:
          OAR_TEST: opencode-aimock
          OAR_TEST_CONCURRENCY: '2'
          OAR_EXPERIMENT_LAYOUT: ${{ matrix.layout }}
          OAR_TEST_MCP_PROGRESS: '1'
          OAR_TEST_REQUIRE_AVAILABLE: '1'
          OAR_CHILD_STDERR: inherit
          OPENCODE_PRINT_LOGS: '1'
          OAR_TRIAL_RUN_DIR: ${{ runner.temp }}/readiness-suite
        run: ./experiments/opencode-windows-readiness/measure.ps1
