name: Windows ACP observations

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "assets/**"]
  workflow_dispatch:
    inputs:
      grok_long_initialize:
        description: 'Run only the isolated 90-second Grok startup and CPU diagnostic'
        type: boolean
        default: false

jobs:
  # Observations remain red on failure and retain artifacts. This workflow
  # never runs on pull requests; ci.yml remains the merge and release gate.
  acp-windows:
    if: ${{ !inputs.grok_long_initialize }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        backend: [kimi-aimock, grok-aimock, opencode-aimock]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      OAR_TEST: ${{ matrix.backend }}
      OAR_TEST_REQUIRE_AVAILABLE: '1'
      OAR_TEST_CONCURRENCY: '2'
      OAR_TRIAL_RUN_DIR: ${{ github.workspace }}/oar-trial-run
      OAR_CHILD_STDERR: ${{ matrix.os == 'windows-latest' && 'inherit' || '' }}
      OAR_TEST_MCP_PROGRESS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # All three packages carry native dependencies in npm tarballs. Cache
      # downloads, not a mutable global installation or runtime HOME.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/AppData/Local/npm-cache
          key: npm-acp-${{ runner.os }}-${{ runner.arch }}-${{ matrix.backend }}-${{ hashFiles('.github/runtime-versions.json') }}
      - name: Install and verify accepted native runtime
        run: node .github/scripts/runtime-install.mjs '${{ matrix.backend }}'
      - run: pnpm run sea-trial
        if: matrix.backend != 'grok-aimock'
        timeout-minutes: 12
      - run: pnpm vitest run sea-trial/vendor --maxWorkers 2
        if: matrix.backend != 'grok-aimock'
        timeout-minutes: 12
      - name: Observe Grok behavior processes
        id: grok_behavior
        if: matrix.backend == 'grok-aimock'
        run: pnpm tsx experiments/grok-startup/behavior-observed.ts
        timeout-minutes: 12
        env:
          OAR_GROK_PROCESS_TRACE: ${{ github.workspace }}/oar-trial-run/grok-processes/behavior
      - name: Observe Grok vendor processes
        id: grok_vendor
        if: matrix.backend == 'grok-aimock'
        run: pnpm vitest run sea-trial/vendor --maxWorkers 2 --config experiments/grok-startup/vitest.config.ts
        timeout-minutes: 12
        env:
          OAR_GROK_PROCESS_TRACE: ${{ github.workspace }}/oar-trial-run/grok-processes/vendor
      - name: Validate Grok process observation
        if: always() && matrix.backend == 'grok-aimock'
        run: pnpm tsx --test experiments/grok-startup/observer.test.ts
        timeout-minutes: 2
      - name: Check Grok suite process evidence
        if: always() && matrix.backend == 'grok-aimock'
        run: pnpm tsx experiments/grok-startup/check-capture.ts "${{ steps.grok_behavior.outcome }}" "${{ steps.grok_vendor.outcome }}"
      - name: Measure Grok ACP launch paths
        if: always() && matrix.backend == 'grok-aimock'
        run: pnpm tsx experiments/grok-acp-startup.ts "$env:OAR_CI_NPM_ROOT"
        timeout-minutes: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sea-trial-${{ matrix.backend }}-${{ matrix.os }}
          path: ${{ github.workspace }}/oar-trial-run
          if-no-files-found: warn

  grok-long-initialize:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.grok_long_initialize }}
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      OAR_TRIAL_RUN_DIR: ${{ github.workspace }}/oar-trial-run
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install -g @xai-official/grok@1.0.70
      # Do not run grok --version or any suite before the numbered launches.
      # npm lifecycle installation can still touch files or execute vendor code.
      - name: Observe eight Grok starts with a 90-second initialize limit
        run: pnpm tsx experiments/grok-startup/long-wait-probe.ts
        timeout-minutes: 12
      - name: Validate CPU sampler after native observations
        if: always()
        run: pnpm tsx --test experiments/grok-startup/wait-cpu.test.ts
        timeout-minutes: 2
      - name: Record installed native version after observations
        if: always()
        run: grok --version
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grok-long-initialize-windows
          path: ${{ github.workspace }}/oar-trial-run
          if-no-files-found: error
